# Motion (use-case algorithm) configuration. Lengths in cm, speeds in cm/s, accelerations in cm/s^2.
# Measured by tools/motion_sweep.py on 2026-10-25. Window and order: lowest worst-case interior
#   acceleration error over the sweep drives (demo, hard). Tolerances: 1.5 x the largest measured
#   interior max error over the sweep drives and a random-scenario search (1502 scenarios, 2 pinned,
#   seed 0), rounded up to 0.1.
window_frames: 16  # frames in the sliding fit window
poly_order: 2  # polynomial order of the local fit (2 or 3)
min_points: 9  # fewest valid frames in a window needed to fit
max_gap_frames: 4  # largest allowed spacing between neighbouring window points, in frame intervals (4 bridges 3 missing frames)
position_keypoint: centroid  # keypoint name from config/etl.yaml
tolerances:
  velocity_cm_s: 19.4  # cm/s
  acceleration_cm_s2: 31.9  # cm/s^2
