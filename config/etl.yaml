# ETL (loader) configuration. Lengths in cm, speeds in cm/s.
supported_schema_versions: [2]  # raw schema versions the loader accepts
chunk_mib: 128  # MiB of raw int32 xyz point data per chunk (12 bytes per point)
max_row_group_mib: 2048  # MiB; a frames row group above this (uncompressed) rejects the drive
max_points_per_frame: 2000000  # points; a manifest above this rejects the drive before any allocation
lake_dir: warehouse  # lake root; VL_LAKE_DIR overrides

limits:
  # A Tesla's top speed, 322 km/h = 8,944 cm/s, rounded up; faster motion is implausible.
  max_speed_cm_s: 9000.0  # cm/s
  rounding_margin_cm: 2.0  # cm, allowance for int cm rounding of positions

# Corner bits are (x, y, z), 0 = low end, 1 = high end. The lattice index is derived from the
# drive's points per axis n: bx*(n-1)*n*n + by*(n-1)*n + bz*(n-1), so any density works.
keypoints:
  - {name: corner_000, kind: corner, bits: [0, 0, 0]}
  - {name: corner_001, kind: corner, bits: [0, 0, 1]}
  - {name: corner_010, kind: corner, bits: [0, 1, 0]}
  - {name: corner_011, kind: corner, bits: [0, 1, 1]}
  - {name: corner_100, kind: corner, bits: [1, 0, 0]}
  - {name: corner_101, kind: corner, bits: [1, 0, 1]}
  - {name: corner_110, kind: corner, bits: [1, 1, 0]}
  - {name: corner_111, kind: corner, bits: [1, 1, 1]}
  - {name: centroid, kind: centroid}
